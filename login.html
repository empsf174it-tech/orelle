<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Orelle VIP</title>
  <meta name="description" content="Access your Orelle VIP account.">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <div class="auth-card animate-fade-in">
      <div class="auth-head">
        <a href="index.html" class="logo auth-logo">Orelle</a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-sub">Access your VIP rewards and saved preferences.</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="loginEmail">Email</label>
          <input type="email" class="auth-input" name="email" id="loginEmail" autocomplete="email" required>
          <div class="auth-error"></div>
        </div>
        <div class="auth-field">
          <label class="auth-label" for="loginPassword">Password</label>
          <div class="auth-input-wrap">
            <input type="password" class="auth-input" name="password" id="loginPassword" autocomplete="current-password" required>
            <button type="button" class="auth-eye" aria-label="Show password"><i class="ph ph-eye"></i></button>
          </div>
          <div class="auth-error"></div>
        </div>

        <div class="auth-options">
          <label class="auth-check" for="loginRemember">
            <input type="checkbox" name="remember" id="loginRemember">
            <span>Remember me</span>
          </label>
          <button type="button" class="auth-forgot" id="forgotPassword">Forgot password?</button>
        </div>
        <div class="auth-notice" id="forgotNotice" role="status"></div>

        <button type="submit" class="btn btn-primary auth-submit">Login</button>
      </form>

      <div class="auth-divider"><span>Or</span></div>

      <div class="auth-social">
        <button type="button" class="auth-social-btn" data-social="google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="auth-social-btn" data-social="apple">
          <i class="ph-fill ph-apple-logo" aria-hidden="true"></i>
          Continue with Apple
        </button>
      </div>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
      <p class="auth-secure"><i class="ph ph-lock-simple"></i> Secure Connection (Demo)</p>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/loyalty.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/auth-ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AuthUI.redirectIfLoggedIn();

      const form = document.getElementById('loginForm');
      const remember = document.getElementById('loginRemember');
      const savedEmail = localStorage.getItem('orelle_remember_email');
      if (savedEmail) {
        document.getElementById('loginEmail').value = savedEmail;
        remember.checked = true;
      }

      // Demo: no reset backend, so explain instead of navigating away
      document.getElementById('forgotPassword').addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value.trim();
        const notice = document.getElementById('forgotNotice');
        notice.textContent = AuthUI.EMAIL_RE.test(email)
          ? `If an account exists for ${email}, a reset link will be sent (demo — no email is actually sent).`
          : 'Enter your email above, then tap "Forgot password?" to receive a reset link (demo).';
        notice.classList.add('show');
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        AuthUI.clearErrors(form);

        const email = document.getElementById('loginEmail');
        const pass = document.getElementById('loginPassword');
        let isValid = true;

        if (!email.value.trim()) { AuthUI.setError(email, 'Please enter your email.'); isValid = false; }
        else if (!AuthUI.EMAIL_RE.test(email.value.trim())) { AuthUI.setError(email, 'Please enter a valid email address.'); isValid = false; }
        if (!pass.value) { AuthUI.setError(pass, 'Please enter your password.'); isValid = false; }

        if (!isValid) return;

        if (remember.checked) localStorage.setItem('orelle_remember_email', email.value.trim());
        else localStorage.removeItem('orelle_remember_email');

        window.Auth.login(email.value.trim(), pass.value);
        AuthUI.goToDestination();
      });
    });
  </script>
</body>
</html>
